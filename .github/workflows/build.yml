name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build helper
        shell: bash
        run: gcc -O2 -Wall -municode -mconsole -static -s -o native/halka-helper.exe native/halka-helper.c -lole32 -loleaut32 -luuid -lshell32
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Halka-windows-x64
          path: |
            dist/*.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Sürüm yayınlamak için: etiket (v*) gönder ya da commit mesajına [release] yaz
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Halka ${{ steps.ver.outputs.v }}
          body_path: .github/release-notes.md
          files: |
            dist/Halka-Setup-*.exe
            dist/Halka-*-portable-*.exe
