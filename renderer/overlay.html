<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' halka: data:;">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="overlay.css">
<title>Halka</title>
</head>
<body>
<div id="stage">
  <div id="ring" class="ring" hidden>
    <div class="ring-disc"></div>
    <svg class="ring-svg" id="ring-svg"></svg>
    <div class="ring-labels" id="ring-labels"></div>
    <div class="ring-center" id="ring-center">
      <div class="center-icon" id="center-icon"></div>
      <div class="center-title" id="center-title"></div>
      <div class="center-sub" id="center-sub"></div>
    </div>
  </div>

  <section id="panel" class="panel" hidden>
    <header class="panel-head">
      <label class="search">
        <svg viewBox="0 0 24 24" class="search-icon"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
        <input id="search" type="text" spellcheck="false" autocomplete="off">
      </label>
      <div class="segments" id="segments" role="tablist"></div>
      <button class="pin-filter" id="pin-filter" title="F"><svg viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8z"/></svg></button>
    </header>
    <div class="panel-body" id="panel-body"></div>
    <footer class="panel-foot" id="panel-foot"></footer>
    <div class="preview" id="preview" hidden></div>
  </section>
  <section id="result" class="result" hidden>
    <header class="result-head">
      <span class="result-title" id="result-title"></span>
      <label class="lang-pick"><span id="result-from"></span><span class="arrow">→</span><select id="result-lang"></select></label>
    </header>
    <div class="result-source" id="result-source"></div>
    <div class="result-text" id="result-text" tabindex="-1"></div>
    <footer class="result-actions">
      <span class="result-meta" id="result-meta"></span>
      <button id="result-copy"></button>
      <button id="result-paste" class="primary"></button>
    </footer>
  </section>
</div>
<script src="icons.js"></script>
<script src="overlay.js"></script>
</body>
</html>
